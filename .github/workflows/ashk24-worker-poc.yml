name: Ashk24 Autonomous Cloud Worker POC

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Specific cPanel Job ID to claim (optional)'
        required: false
        default: ''
      workflow_id:
        description: 'Workflow ID for Distributed State Machine Tracking'
        required: false
        default: ''
      execution_id:
        description: 'Execution ID for Distributed Traceability'
        required: false
        default: ''
      platform_target:
        description: 'Target platform (e.g. payamsara, agahi24, istgah, parscenter, niazpardaz, all)'
        required: false
        default: 'payamsara'
      cpanel_url:
        description: 'cPanel API URL (e.g. https://your-domain.com/cpanel-backend/api/index.php)'
        required: false
        default: ''
      task_action:
        description: 'Direct task action (e.g. open_target_url, verify_publication_url)'
        required: false
        default: ''
      action_id:
        description: 'Action ID for direct task tracking'
        required: false
        default: ''
      task_state:
        description: 'Workflow state machine state'
        required: false
        default: ''
      task_input:
        description: 'JSON serialized input payload'
        required: false
        default: ''
  repository_dispatch:
    types: [ashk24-worker-task]
  # Autonomous periodic run: uncomment after cPanel deployment
  # schedule:
  #   - cron: '0 */4 * * *'

concurrency:
  group: ashk24-worker-execution
  cancel-in-progress: false

jobs:
  browser-worker:
    name: Execute Real Browser Job
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout Repository Source of Truth
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Print Checkout Diagnostics & Worker Version
        shell: bash
        run: |
          set -euo pipefail
          echo "======================================================="
          echo "🔍 Workflow Execution Diagnostics"
          echo "🌿 Branch            : ${{ github.ref_name }} (${{ github.ref }})"
          echo "📌 Real Checked-out SHA: $(git rev-parse HEAD)"
          echo "🏷️ App Version (Config): $(grep 'APP_VERSION =' src/config/version.ts | cut -d"'" -f2)"
          echo "🤖 Worker Version      : $(grep '"version"' local-agent/package.json | head -n 1 | cut -d'"' -f4)"
          echo "🎯 Target Job ID       : ${{ inputs.job_id || github.event.inputs.job_id || 'None (Auto-Claim)' }}"
          echo "🏷️ Platform Target     : ${{ inputs.platform_target || github.event.inputs.platform_target || 'payamsara' }}"
          echo "======================================================="

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'local-agent/package-lock.json'

      - name: Install Local Worker Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd local-agent
          npm install --no-audit --prefer-offline

      - name: Install System Display, VNC & Tunnel Tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y xvfb x11vnc novnc websockify curl netcat-openbsd
          # Create symlink so root / request on noVNC web server serves vnc.html directly
          sudo ln -sf /usr/share/novnc/vnc.html /usr/share/novnc/index.html || true
          # Install cloudflared for secure on-demand Quick Tunnel
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Install Playwright Chromium with System Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd local-agent
          npx playwright install --with-deps chromium

      - name: Intake and Accept Task Dispatch
        id: dispatch_intake
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CPANEL_URL_INPUT: ${{ inputs.cpanel_url || secrets.CPANEL_URL || 'https://secret.ashkghalam.ir/cpanel-backend/api/index.php' }}
          CPANEL_AGENT_TOKEN: ${{ secrets.CPANEL_AGENT_TOKEN || 'secret_9153108763' }}
          WF_ID: ${{ inputs.workflow_id || github.event.inputs.workflow_id || github.event.client_payload.workflow_id || '' }}
          EXEC_ID: ${{ inputs.execution_id || github.event.inputs.execution_id || github.event.client_payload.execution_id || '' }}
          JOB_ID: ${{ inputs.job_id || github.event.inputs.job_id || github.event.client_payload.job_id || '' }}
          ACT_ID: ${{ inputs.action_id || github.event.inputs.action_id || github.event.client_payload.action_id || '' }}
          ACTION: ${{ inputs.task_action || github.event.inputs.task_action || github.event.client_payload.action || '' }}
          STATE: ${{ inputs.task_state || github.event.inputs.task_state || github.event.client_payload.state || '' }}
          INPUT_WF: ${{ inputs.task_input || github.event.inputs.task_input || '' }}
          INPUT_REPO: ${{ toJson(github.event.client_payload.input) }}
          PLATFORM: ${{ inputs.platform_target || github.event.inputs.platform_target || github.event.client_payload.platform || github.event.client_payload.platform_target || 'payamsara' }}
        run: |
          set -euo pipefail
          echo "======================================================="
          echo "📥 [Task Dispatch Intake] Event Type: $EVENT_NAME"
          echo "🏷️ Workflow ID : ${WF_ID:-none}"
          echo "⚡ Execution ID: ${EXEC_ID:-none}"
          echo "🆔 Job ID       : ${JOB_ID:-none}"
          echo "🎯 Action ID    : ${ACT_ID:-auto}"
          echo "⚡ Task Action  : ${ACTION:-None (Claim Mode)}"
          echo "⚡ Task State   : ${STATE:-None}"
          echo "🏷️ Platform     : ${PLATFORM}"
          echo "======================================================="

          FINAL_INPUT="{}"
          if [ -n "$INPUT_WF" ]; then
            FINAL_INPUT="$INPUT_WF"
          elif [ "$INPUT_REPO" != "null" ] && [ -n "$INPUT_REPO" ]; then
            FINAL_INPUT="$INPUT_REPO"
          fi

          echo "WORKFLOW_ID=$WF_ID" >> $GITHUB_ENV
          echo "EXECUTION_ID=$EXEC_ID" >> $GITHUB_ENV
          echo "TARGET_JOB_ID=$JOB_ID" >> $GITHUB_ENV
          echo "ACTION_ID=$ACT_ID" >> $GITHUB_ENV
          echo "TASK_ACTION=$ACTION" >> $GITHUB_ENV
          echo "TASK_STATE=$STATE" >> $GITHUB_ENV
          echo "TASK_INPUT=$FINAL_INPUT" >> $GITHUB_ENV
          echo "PLATFORM_TARGET=$PLATFORM" >> $GITHUB_ENV
          echo "CPANEL_URL=$CPANEL_URL_INPUT" >> $GITHUB_ENV
          echo "TASK_INTAKE_ACCEPTED=true" >> $GITHUB_ENV

          # ۱. ثبت پذیرش تسک در ارکستریتور در صورت وجود شناسه‌ها (وضعیت جداگانه پذیرش)
          if [ -n "$WF_ID" ] && [ -n "$EXEC_ID" ] && [ -n "$CPANEL_URL_INPUT" ]; then
            echo "📡 Reporting dispatch intake acceptance to cPanel Orchestrator..."
            curl -s -X POST "$CPANEL_URL_INPUT?route=workflows/action" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $CPANEL_AGENT_TOKEN" \
              -d "{\"workflowId\":\"$WF_ID\",\"executionId\":\"$EXEC_ID\",\"jobId\":\"$JOB_ID\",\"actionId\":\"$ACT_ID\",\"workerId\":\"gh_actions_${GITHUB_RUN_ID}\",\"worker\":\"github\",\"state\":\"DISPATCH_ACCEPTED\",\"action\":\"task_dispatch_accepted\",\"status\":\"accepted\",\"input\":$FINAL_INPUT}" || true
          fi
          echo "✅ Task Dispatch Accepted."

      - name: Signal Task Execution Started
        id: signal_execution_start
        shell: bash
        env:
          CPANEL_AGENT_TOKEN: ${{ secrets.CPANEL_AGENT_TOKEN || 'secret_9153108763' }}
        run: |
          set -euo pipefail
          # ۲. ثبت آغاز اجرا در ارکستریتور (وضعیت جداگانه شروع اجرا)
          if [ -n "${WORKFLOW_ID:-}" ] && [ -n "${EXECUTION_ID:-}" ] && [ -n "${CPANEL_URL:-}" ]; then
            echo "📡 Reporting task execution start to cPanel Orchestrator..."
            curl -s -X POST "$CPANEL_URL?route=workflows/action" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $CPANEL_AGENT_TOKEN" \
              -d "{\"workflowId\":\"$WORKFLOW_ID\",\"executionId\":\"$EXECUTION_ID\",\"jobId\":\"${TARGET_JOB_ID:-}\",\"actionId\":\"${ACTION_ID:-}\",\"workerId\":\"gh_actions_${GITHUB_RUN_ID}\",\"worker\":\"github\",\"state\":\"${TASK_STATE:-RUNNING}\",\"action\":\"${TASK_ACTION:-task_execution_started}\",\"status\":\"running\",\"input\":${TASK_INPUT:-{}}}" || true
          fi
          echo "🚀 Task Execution Started Signal Sent."

      - name: Execute Browser Worker Task
        id: execute_worker_task
        shell: bash
        env:
          CPANEL_AGENT_TOKEN: ${{ secrets.CPANEL_AGENT_TOKEN || 'secret_9153108763' }}
          IRAN_PROXY_URL: ${{ secrets.IRAN_PROXY_URL }}
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD || 'Ashk24SecureSession' }}
          HEADLESS: 'false'
          CI: 'true'
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # 1. Setup virtual framebuffer Xvfb
          echo "🖥️ Starting Xvfb on DISPLAY :99..."
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          XVFB_PID=$!
          export DISPLAY=:99

          # Health-check Xvfb display socket
          echo "⏳ Waiting for Xvfb display socket /tmp/.X11-unix/X99..."
          for i in {1..30}; do
            if [ -S /tmp/.X11-unix/X99 ]; then
              echo "✅ Xvfb display :99 is ready."
              break
            fi
            sleep 0.5
          done

          if [ ! -S /tmp/.X11-unix/X99 ]; then
            echo "❌ [Fatal] Xvfb failed to initialize on DISPLAY :99."
            exit 1
          fi

          # 2. Setup password-protected VNC daemon on 127.0.0.1:5900
          echo "🔐 Starting x11vnc daemon..."
          mkdir -p ~/.vnc
          x11vnc -storepasswd "$VNC_PASSWORD" ~/.vnc/passwd
          x11vnc -display :99 -forever -shared -rfbauth ~/.vnc/passwd -listen 127.0.0.1 -rfbport 5900 &
          VNC_PID=$!

          # Health-check VNC port 5900
          echo "⏳ Waiting for x11vnc port 5900..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 5900 2>/dev/null; then
              echo "✅ x11vnc listening on 127.0.0.1:5900."
              break
            fi
            sleep 0.5
          done

          if ! nc -z 127.0.0.1 5900 2>/dev/null; then
            echo "❌ [Fatal] x11vnc failed to bind port 5900."
            exit 1
          fi

          # 3. Setup websockify / noVNC web interface on 127.0.0.1:6080
          echo "🌐 Starting websockify / noVNC bridge on 127.0.0.1:6080..."
          websockify --web=/usr/share/novnc 6080 127.0.0.1:5900 &
          WEBSOCK_PID=$!

          # Health-check websockify port 6080
          echo "⏳ Waiting for websockify/noVNC on http://127.0.0.1:6080..."
          for i in {1..30}; do
            if nc -z 127.0.0.1 6080 2>/dev/null || curl -s http://127.0.0.1:6080/ >/dev/null; then
              echo "✅ websockify/noVNC bridge is up and serving on http://127.0.0.1:6080."
              break
            fi
            sleep 0.5
          done

          if ! nc -z 127.0.0.1 6080 2>/dev/null; then
            echo "❌ [Fatal] websockify failed to bind port 6080."
            exit 1
          fi

          cleanup() {
            local exit_code=$?
            echo "🛑 [Cleanup] Shutting down virtual display and network daemons..."
            kill $WEBSOCK_PID $VNC_PID $XVFB_PID 2>/dev/null || true
            exit "$exit_code"
          }
          trap cleanup EXIT INT TERM

          echo "======================================================="
          echo "🚀 Launching Ashk24 Cloud Worker Engine..."
          echo "🌿 Branch            : ${{ github.ref_name }}"
          echo "📌 Real Checked-out SHA: $(git rev-parse HEAD)"
          echo "🏷️ App Version (Config): $(grep 'APP_VERSION =' src/config/version.ts | cut -d"'" -f2)"
          echo "🤖 Worker Version      : $(grep '"version"' local-agent/package.json | head -n 1 | cut -d'"' -f4)"
          echo "🎯 Target Job ID       : ${TARGET_JOB_ID:-None (Auto-Claim)}"
          echo "🏷️ Platform Target     : ${PLATFORM_TARGET:-payamsara}"
          echo "⚡ Task Action         : ${TASK_ACTION:-None (Job Claim Mode)}"
          echo "⚡ Action ID           : ${ACTION_ID:-None}"
          echo "⚡ Task State          : ${TASK_STATE:-None}"
          echo "======================================================="

          node local-agent/index.js --once --cloud-mode

      - name: Complete Task Execution and Report Outcome
        if: always()
        shell: bash
        env:
          EXECUTION_OUTCOME: ${{ steps.execute_worker_task.outcome }}
          CPANEL_AGENT_TOKEN: ${{ secrets.CPANEL_AGENT_TOKEN || 'secret_9153108763' }}
        run: |
          set -euo pipefail
          echo "======================================================="
          echo "📊 [Task Completion Evaluation]"
          echo "Outcome     : $EXECUTION_OUTCOME"
          echo "Workflow ID : ${WORKFLOW_ID:-none}"
          echo "Execution ID: ${EXECUTION_ID:-none}"
          echo "Job ID      : ${TARGET_JOB_ID:-none}"
          echo "Action ID   : ${ACTION_ID:-none}"
          echo "Task Action : ${TASK_ACTION:-none}"
          echo "Task State  : ${TASK_STATE:-none}"
          echo "======================================================="

          # ۳. ثبت تکمیل Task با شناسه‌های مشترک (وضعیت جداگانه تکمیل / شکست)
          if [ "$EXECUTION_OUTCOME" != "success" ]; then
            echo "❌ Execution step failed or returned non-zero exit code."
            if [ -n "${WORKFLOW_ID:-}" ] && [ -n "${EXECUTION_ID:-}" ] && [ -n "${CPANEL_URL:-}" ]; then
              echo "📡 Reporting failure to Workflow Orchestrator..."
              curl -s -X POST "$CPANEL_URL?route=workflows/action" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CPANEL_AGENT_TOKEN" \
                -d "{\"workflowId\":\"$WORKFLOW_ID\",\"executionId\":\"$EXECUTION_ID\",\"jobId\":\"${TARGET_JOB_ID:-}\",\"actionId\":\"${ACTION_ID:-}\",\"workerId\":\"gh_actions_${GITHUB_RUN_ID}\",\"worker\":\"github\",\"state\":\"${TASK_STATE:-FAILED}\",\"action\":\"${TASK_ACTION:-worker_execution}\",\"status\":\"failed\",\"error\":\"GitHub Worker execution failed or returned invalid result.\",\"input\":${TASK_INPUT:-{}}}" || true
            fi
            echo "🚨 Exiting with non-zero exit code to fail GitHub Actions workflow..."
            exit 1
          else
            echo "✅ GitHub Worker Task Completed Successfully."
            if [ -n "${WORKFLOW_ID:-}" ] && [ -n "${EXECUTION_ID:-}" ] && [ -n "${CPANEL_URL:-}" ]; then
              echo "📡 Reporting task completion to Workflow Orchestrator..."
              curl -s -X POST "$CPANEL_URL?route=workflows/action" \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer $CPANEL_AGENT_TOKEN" \
                -d "{\"workflowId\":\"$WORKFLOW_ID\",\"executionId\":\"$EXECUTION_ID\",\"jobId\":\"${TARGET_JOB_ID:-}\",\"actionId\":\"${ACTION_ID:-}\",\"workerId\":\"gh_actions_${GITHUB_RUN_ID}\",\"worker\":\"github\",\"state\":\"${TASK_STATE:-COMPLETED}\",\"action\":\"${TASK_ACTION:-worker_execution}\",\"status\":\"completed\",\"input\":${TASK_INPUT:-{}}}" || true
            fi
          fi

      - name: Upload Execution Evidence (Screenshots / Traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashk24-worker-evidence-${{ github.run_id }}
          path: local-agent/evidence/
          retention-days: 7

